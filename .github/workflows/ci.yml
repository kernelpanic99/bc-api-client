name: CI
on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v31
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Cache devenv
        uses: cachix/cachix-action@v16
        with:
          name: devenv
          skipPush: true

      - name: Install devenv
        run: nix profile add nixpkgs#devenv

      - name: Install dependencies
        run: devenv shell -- pnpm install --frozen-lockfile

      - name: Quality checks
        run: devenv shell -- pnpm qa
